# ══════════════════════════════════════════════════════════════
#  Netlify Configuration — GoodDoctor's Shop (D:\ProjetGd)
# ══════════════════════════════════════════════════════════════

[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  # L'URL du projet Supabase est publique par nature (utilisée dans img-src de la CSP
  # et dans les URLs d'images de products-snapshot.json). Les clés (SUPABASE_SERVICE_ROLE_KEY,
  # SUPABASE_ANON_KEY, CASHPAY_*) restent intégralement surveillées par le scanner de secrets.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,VITE_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_URL"

[dev]
  command = "npm run dev"
  targetPort = 8443
  port = 8888

# ── /api/products : Netlify Edge Function (netlify/edge-functions/products.ts) ──
# Le chemin est déclaré dans `export const config` de la fonction ; les edge functions
# s'exécutent avant les redirections, le fallback SPA ci-dessous ne l'intercepte donc pas.

# ── SPA fallback ──
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ══════════════════════════════════════════════════════════════
#  HEADERS DE SÉCURITÉ GLOBAUX
# ══════════════════════════════════════════════════════════════

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "0"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"
    X-Permitted-Cross-Domain-Policies = "none"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://jhybjpetiotzbtkfbxkr.supabase.co https://images.unsplash.com https://*.tile.openstreetmap.org https://unpkg.com; connect-src 'self' https://nominatim.openstreetmap.org https://router.project-osrm.org; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"

# ── index.html : toujours revalidé (évite de servir un vieux bundle/CSP) ──
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# ── Cache agressif pour les assets buildés ──
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
